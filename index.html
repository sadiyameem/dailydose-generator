<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, iniitial-scale=1.0">
        <title>DailyDose Generator</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="container">
            <h3>Fortune Cookie</h3>
            <h1>🥠</h1>
            <p id="fortuneMessage">Click the cookie to get your fortune</p>
            <button id="openCookie">Crack Cookie</button>
        </div>
        <div class="container2">
            <h3>Motivation</h3>
            <h1>💪</h1>
            <p id="motivationMessage">Click the button for some motivation</p>
            <button id="getmotivated">Get Motivated</button>
        </div>
        <div class="container3">
            <h3>Inspiration</h3>
            <h1>💡</h1>
            <p id="inspirationMessage">Click the button for some inspiration</p>
            <button id="getinspired">Get Inspired</button>
        </div>
        <div class="container4">
            <h3>Jokes</h3>
            <h1>😆</h1>
            <p id="jokeMessage">Click the button for some jokes</p>
            <button id="getjokes">Get Jokes</button>
        </div>
        <div class="container5">
            <h3>Compliment</h3>
            <h1>💖</h1>
            <p id="complimentMessage">Click for a compliment</p>
            <button id="getcompliment">Get Compliment</button>
        </div>
        <script src="script.js"></script>
    </body>
</html>
